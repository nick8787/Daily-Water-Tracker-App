name: daily_water_tracker
description: Daily Water Tracker App

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 0.0.17+17

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  crypto: ^3.0.6
  logging: ^1.3.0
  flutter_secure_storage: ^10.0.0
  equatable: ^2.0.7
  stream_transform: ^2.1.1
  go_router: ^15.1.2
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7+1
  url_strategy: ^0.3.0
  hive: ^3.0.0-dev
  hive_flutter: ^2.0.0-dev
  google_fonts: ^8.0.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  bloc_test: ^10.0.0
  mockito: ^5.4.6
  pub_semver: ^2.2.0
  package_info_plus: ^8.3.0
  in_app_update: ^4.2.3
  url_launcher: ^6.3.1
  get_it: ^8.0.3
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_analytics: ^12.3.0
  cloud_firestore: ^6.3.0
  firebase_app_check: ^0.4.3
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.6
  sign_in_with_apple: ^7.0.1
  flutter_svg: ^2.1.0
  web_socket_client: ^0.2.1
  flutter_native_splash: ^2.4.6
  intl: ^0.20.2
  firebase_crashlytics: ^5.2.0
  stack_trace: ^1.12.1
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.0.0
  firebase_remote_config: ^6.4.0
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  image_picker: ^1.2.2
  percent_indicator: ^4.2.5
  app_links: ^6.4.0
  share_plus: ^11.1.0
  permission_handler: ^12.0.1
  fl_chart: ^1.2.0
  confetti: ^0.8.0
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0
  lint: ^2.8.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/launcher/
    - assets/splash/
    - assets/splash/ios/
    - assets/images/
    - assets/svgs/
    - assets/i18n/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
  
flutter_gen:
  output: lib/generated/ 
  integrations:
    flutter_svg: true