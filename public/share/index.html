<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Water Tracker</title>
    <meta
      name="description"
      content="A friend shared their daily hydration progress with you."
    >
    <!-- Static Open Graph fallback for link preview crawlers (Telegram, iMessage, Slack). -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Daily Water Tracker">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Daily Water Tracker — Shared hydration">
    <meta
      property="og:description"
      content="A friend shared their daily hydration progress with you. Track yours too."
    >
    <meta property="og:url" content="/share">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Daily Water Tracker — Shared hydration">
    <meta
      name="twitter:description"
      content="A friend shared their daily hydration progress with you. Track yours too."
    >
    <link rel="canonical" href="/share">
    <meta name="theme-color" content="#12A0E6">
    <link rel="icon" type="image/png" sizes="58x58" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/assets/share.css">
  </head>
  <body data-page="share">
    <main class="page">
      <div class="page__inner">
        <header class="brand">
          <img
            class="brand__icon"
            data-app-icon
            src="/assets/app-icon-prod.png"
            width="56"
            height="56"
            alt="Daily Water Tracker"
          >
          <div class="brand__text">
            <h1 class="brand__title" id="brand-title">Daily Water Tracker</h1>
            <span class="brand__badge" id="env-badge">Dev</span>
          </div>
        </header>

        <section class="card" id="share-card" aria-labelledby="card-eyebrow">
          <p class="card__eyebrow" id="card-eyebrow">Shared progress</p>

          <div class="card__generic-icon" aria-hidden="true">
            <img
              data-app-icon
              src="/assets/app-icon-prod.png"
              width="36"
              height="36"
              alt=""
              style="border-radius: 8px;"
            >
          </div>

          <div class="card__volume-wrap">
            <p class="card__volume" id="card-volume" aria-live="polite">
              0<span class="card__unit">ml</span>
            </p>
            <p class="card__subtitle" id="card-subtitle">drank today</p>
          </div>

          <p class="card__message" id="card-message">
            A friend shared their daily hydration progress with you.
          </p>
        </section>

        <section class="cta-block" aria-labelledby="cta-title">
          <h2 class="cta-block__title" id="cta-title">Track yours too</h2>
          <div class="store-buttons">
            <a
              class="store-button"
              id="ios-button"
              href="https://appdistribution.firebase.dev/i/38466fc6f0cdf4e4"
              rel="noopener noreferrer"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"
                />
              </svg>
              <span id="ios-button-label">Install on iOS</span>
            </a>
            <a
              class="store-button store-button--secondary"
              id="android-button"
              href="https://appdistribution.firebase.dev/i/38466fc6f0cdf4e4"
              rel="noopener noreferrer"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M3 20.5V3.5C3 2.91 3.34 2.39 3.84 2.15L13.69 12 3.84 21.85C3.34 21.6 3 21.09 3 20.5zm13.81-5.38L6.05 21.34l8.49-8.49 2.27 2.27zm3.35-4.31c.34.27.59.69.59 1.19s-.22.92-.57 1.19l-2.29 1.32-2.5-2.5 2.5-2.5 2.29 1.32zM6.05 2.66l10.76 6.22-2.27 2.27L6.05 2.66z"
                />
              </svg>
              <span id="android-button-label">Install on Android</span>
            </a>
          </div>
        </section>

        <section class="qr-section" id="qr-section" aria-labelledby="qr-label">
          <p class="qr-section__label" id="qr-label">Scan to download on your phone</p>
          <div class="qr-section__frame">
            <img
              class="qr-section__image"
              id="qr-image"
              width="168"
              height="168"
              alt="QR code to download the app"
            >
          </div>
        </section>

        <p class="footer-note" id="footer-note">
          Already have the app? Open the same link on your phone — it will launch automatically.
        </p>
      </div>
    </main>

    <script src="/assets/share.js"></script>
  </body>
</html>
