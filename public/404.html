<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · Daily Water Tracker</title>
    <meta name="theme-color" content="#12A0E6">
    <link rel="icon" type="image/png" sizes="58x58" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/assets/share.css">
    <style>
      .not-found__code {
        margin: 0 0 8px;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .not-found__title {
        margin: 0 0 12px;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="page__inner">
        <header class="brand">
          <img
            class="brand__icon"
            src="/assets/app-icon.png"
            width="56"
            height="56"
            alt="Daily Water Tracker"
          >
          <div class="brand__text">
            <h1 class="brand__title">Daily Water Tracker</h1>
          </div>
        </header>

        <section class="card" style="text-align: left;">
          <p class="not-found__code">404</p>
          <h2 class="not-found__title">Page not found</h2>
          <p class="card__message" style="margin: 0; padding: 0; border: 0;">
            This link may be outdated. Head back to the app home page or open a shared progress link.
          </p>
        </section>

        <p class="footer-note" style="margin-top: 20px;">
          <a href="/">Go to home</a>
        </p>
      </div>
    </main>
  </body>
</html>
