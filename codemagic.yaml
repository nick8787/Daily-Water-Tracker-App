workflows:
  dev-workflow:
    name: Development Workflow
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      groups:
        - development
        - common
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Tool versions
        script: |
          flutter --version
          java -version

      - name: Decode Firebase configs (DEV)
        script: |
          mkdir -p android/app/src/dev ios/config/dev
          echo "$ANDROID_FIREBASE_SECRET_DEV" | tr -d '\n\r ' | base64 --decode > android/app/src/dev/google-services.json
          echo "$IOS_FIREBASE_SECRET_DEV" | tr -d '\n\r ' | base64 --decode > ios/config/dev/GoogleService-Info.plist

      - name: Decode app credentials config (DEV)
        script: |
          if [ -z "${CREDENTIALS_DEV_BASE64:-}" ]; then
            echo "CREDENTIALS_DEV_BASE64 is not set." >&2
            exit 1
          fi
          mkdir -p assets
          echo "$CREDENTIALS_DEV_BASE64" | tr -d '\n\r ' | base64 --decode > assets/config_development.json

      - name: Extract Firebase App IDs (DEV)
        script: python3 scripts/ci/extract_firebase_app_ids.py dev

      - name: Set up Android keystore
        script: |
          echo "$CM_KEYSTORE" | tr -d '\n\r ' | base64 --decode > /tmp/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/upload-keystore.jks
          EOF

      - name: Prepare iOS dependencies
        script: bash ios/ci/prepare_ios_project.sh

      - name: Set up iOS code signing (Development)
        script: bash ios/ci/setup_codemagic_signing.sh com.dailywatertracker.app.dev development

      - name: Build Android Release (DEV Flavor)
        script: |
          flutter build apk --release --flavor dev --build-name=0.0.$BUILD_NUMBER --build-number=$BUILD_NUMBER

      - name: Build iOS IPA (Development)
        script: |
          flutter build ipa --release \
            --flavor dev \
            --build-name=0.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --export-method development

      - name: Upload debug symbols (dSYM) to Firebase
        script: bash ios/ci/upload_crashlytics_dsyms.sh ios/config/dev/GoogleService-Info.plist

    artifacts:
      - build/app/outputs/flutter-apk/app-dev-release.apk
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/**/*.dSYM

    publishing:
      email:
        recipients:
          - mykola.shchypailo@gmail.com
      scripts:
        - name: Publish Android to Firebase App Distribution
          script: |
            npx --yes firebase-tools@latest appdistribution:distribute "build/app/outputs/flutter-apk/app-dev-release.apk" \
              --app "$FIREBASE_APP_ID_ANDROID" \
              --groups "internal-testers" \
              --release-notes "$(bash scripts/ci/release_notes_text.sh)" \
              --token "$FIREBASE_TOKEN"

        - name: Publish iOS to Firebase App Distribution
          script: |
            IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
            if [ -z "$IPA_PATH" ]; then
              echo "Error: IPA file not found!" >&2
              exit 1
            fi
            npx --yes firebase-tools@latest appdistribution:distribute "$IPA_PATH" \
              --app "$FIREBASE_APP_ID_IOS" \
              --groups "internal-testers" \
              --release-notes "$(bash scripts/ci/release_notes_text.sh)" \
              --token "$FIREBASE_TOKEN"

  prod-workflow:
    name: Production Workflow
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      groups:
        - production
        - common
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: production
          include: true
        - pattern: master
          include: true
        - pattern: dev
          include: true
    scripts:
      - name: Tool versions
        script: |
          flutter --version
          java -version

      - name: Decode Firebase configs (PROD)
        script: |
          mkdir -p android/app/src/prod ios/config/prod
          echo "$ANDROID_FIREBASE_SECRET_PROD" | tr -d '\n\r ' | base64 --decode > android/app/src/prod/google-services.json
          echo "$IOS_FIREBASE_SECRET_PROD" | tr -d '\n\r ' | base64 --decode > ios/config/prod/GoogleService-Info.plist

      - name: Decode app credentials config (PROD)
        script: |
          if [ -z "${CREDENTIALS_PROD_BASE64:-}" ]; then
            echo "CREDENTIALS_PROD_BASE64 is not set." >&2
            exit 1
          fi
          mkdir -p assets
          echo "$CREDENTIALS_PROD_BASE64" | tr -d '\n\r ' | base64 --decode > assets/config_production.json

      - name: Extract Firebase App IDs (PROD)
        script: python3 scripts/ci/extract_firebase_app_ids.py prod

      - name: Set up Android keystore
        script: |
          echo "$CM_KEYSTORE" | tr -d '\n\r ' | base64 --decode > /tmp/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/upload-keystore.jks
          EOF

      - name: Prepare iOS dependencies
        script: bash ios/ci/prepare_ios_project.sh

      - name: Set up iOS code signing (App Store)
        script: bash ios/ci/setup_codemagic_signing.sh com.dailywatertracker.app.prod appstore

      - name: Build Android Release (Bundle & APK)
        script: |
          APP_VERSION=${CM_TAG:-$(git describe --tags $(git rev-list --tags --max-count=1))}
          APP_VERSION=${APP_VERSION#v}
          flutter build appbundle --release --flavor prod --build-name=$APP_VERSION --build-number=$BUILD_NUMBER
          flutter build apk --release --flavor prod --build-name=$APP_VERSION --build-number=$BUILD_NUMBER

      - name: Build iOS IPA (App Store)
        script: |
          APP_VERSION=${CM_TAG:-$(git describe --tags $(git rev-list --tags --max-count=1))}
          APP_VERSION=${APP_VERSION#v}
          flutter build ipa --release --flavor prod --build-name=$APP_VERSION --build-number=$BUILD_NUMBER --export-method app-store

      - name: Upload debug symbols (dSYM) to Firebase
        script: bash ios/ci/upload_crashlytics_dsyms.sh ios/config/prod/GoogleService-Info.plist

    artifacts:
      - build/app/outputs/bundle/prodRelease/*.aab
      - build/app/outputs/flutter-apk/app-prod-release.apk
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/**/*.dSYM

    publishing:
      email:
        recipients:
          - mykola.shchypailo@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      scripts:
        - name: Publish Android to Firebase App Distribution
          script: |
            npx --yes firebase-tools@latest appdistribution:distribute "build/app/outputs/flutter-apk/app-prod-release.apk" \
              --app "$FIREBASE_APP_ID_ANDROID_PROD" \
              --groups "internal-testers" \
              --release-notes "$(bash scripts/ci/release_notes_text.sh)" \
              --token "$FIREBASE_TOKEN"
